name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:    

# This block fixes the 403 Permission error!
permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate user statistician SVG
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          image-file: stats.svg
          colors: dark
